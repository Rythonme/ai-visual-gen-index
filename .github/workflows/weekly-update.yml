name: 每日自动更新榜单

# 每日 UTC 00:30 = 北京时间 08:30：检索新资源 -> 护栏过滤 -> 自动收录 -> 重算榜单
#   -> 自动提交 -> 由 pages.yml 自动部署网站。
# 每周一的这一次运行同时作为该周周报节点（周报按 ISO 周覆盖生成）。
# 说明：GitHub 对 schedule 有少量延迟属正常；仓库超过 60 天无任何活动会自动暂停定时任务，
# 手动触发一次 workflow_dispatch 即可恢复。
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/tools.json'
      - 'data/config.json'
      - 'data/auto_tools.json'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: auto-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检索并自动收录新资源
        # 只读 GitHub Search API 公开元数据；护栏规则见 data/config.json -> auto_admit。
        # 搜索接口限流不应阻断已有资源的榜单刷新，因此设为 continue-on-error。
        run: python scripts/discover.py --verbose
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 抓取公开指标并生成榜单
        # 合并人工层 tools.json 与自动层 auto_tools.json，只读公开元数据，不下载任何模型或素材
        run: python scripts/build.py --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验外链可用性
        # 超时/反爬记为 unknown，不阻断流程
        run: python scripts/check_links.py
        continue-on-error: true

      - name: 带入链接校验结果重新生成
        run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交本次变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次榜单无变化，跳过提交"
          else
            git commit -m "chore: auto ranking update $(date -u +%Y-%m-%d)"
            git push
          fi
